# Локальный учебный кластер: один узел (control-plane) = один Docker-контейнер lab-control-plane.
# NodePort 30080 проброшен на localhost:30080 ноутбука — так приложение открывается в браузере.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP
