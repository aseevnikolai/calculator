# Приложение: nginx со сборкой калькулятора. Настройки — из ConfigMap, пароль — из Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  namespace: calculator
  labels:
    app.kubernetes.io/name: calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: calculator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculator
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: calculator:1.2.1
          # образ загружен в кластер kind командой `kind load`, из реестра его не тянем
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: calculator-config
            - secretRef:
                name: calculator-secret
